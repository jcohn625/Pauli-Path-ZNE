[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pauli-cnot-zne"
version = "0.1.0"
readme = "README.md"
description = "CNOT-resolved Heisenberg MPS curves and zero-noise extrapolation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=7"]
notebook = ["jupyterlab>=4", "ipykernel>=6", "nbformat>=5", "nbclient>=0.8", "matplotlib>=3.7", "pandas>=2"]

[project.scripts]
pauli-zne = "pauli_zne.cli:main"

[tool.setuptools.packages.find]
include = ["pauli_zne*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
